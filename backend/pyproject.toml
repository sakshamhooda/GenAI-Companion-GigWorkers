[project]
name = "gigworker-backend"
version = "0.1.0"
description = "FastAPI backend for the Gig Worker Companion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "itsdangerous>=2.2",
    "google-genai>=1.0",
    "google-auth>=2.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "aiosqlite>=0.20",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=72"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
